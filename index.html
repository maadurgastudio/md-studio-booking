<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>माँ दुर्गा फोटो एंड वीडियोग्राफी</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📸 माँ दुर्गा फोटो एंड वीडियोग्राफी</h1>
<p>आपके हर खास पल को यादगार बनाने का हमारा प्रयास</p>
</header>


<section class="booking">

<h2>📋 Booking Form</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="पूरा नाम" required>

<input type="tel" id="mobile" placeholder="मोबाइल नंबर" required>

<textarea id="address" placeholder="पूरा पता" required></textarea>


<select id="event" required>
<option value="">Event Type Select करें</option>
<option>Wedding</option>
<option>Pre Wedding</option>
<option>Birthday</option>
<option>Reception</option>
<option>Other</option>
</select>


<input type="date" id="date" required>


<input type="time" id="time" required>


<select id="package" required>
<option value="">Package Select करें</option>
<option>4K Videography - ₹10000</option>
<option>DSLR Photography - ₹8000</option>
<option>Drone Shoot - ₹8000</option>
<option>4K + DSLR - ₹16999</option>
<option>4K + Drone - ₹16999</option>
<option>DSLR + Drone - ₹14999</option>
<option>4K + DSLR + Drone - ₹24999</option>
</select>


<textarea id="message" placeholder="Extra Message"></textarea>


<button type="submit">
BOOK NOW
</button>


</form>

</section>


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script src="script.js"></script>

</body>
</html>
