
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MD Studio Booking</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>माँ दुर्गा फोटो एंड वीडियोग्राफी</h1>

<p>आपके हर खास पल को यादगार बनाने का हमारा प्रयास</p>


<h2>Booking Form</h2>


<form>

<input type="text" placeholder="आपका नाम" required>

<br><br>

<input type="number" placeholder="मोबाइल नंबर" required>

<br><br>

<input type="date" required>

<br><br>


<select>
<option>Event Type</option>
<option>Wedding</option>
<option>Pre Wedding</option>
<option>Birthday</option>
</select>


<br><br>


<select required>

<option>Select Package</option>
<option>4K Videography</option>
<option>DSLR Photography</option>
<option>Drone Shoot</option>
<option>4K + DSLR</option>
<option>4K + Drone</option>
<option>DSLR + Drone</option>
<option>4K + DSLR + Drone</option>

</select>


<br><br>


<button type="submit">
BOOK NOW
</button>


</form>


<script type="module" src="script.js"></script>


</body>
</html>
