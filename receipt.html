<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking Receipt</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>माँ दुर्गा फोटो एंड वीडियोग्राफी</h1>

<h2>Booking Receipt</h2>


<div>

<p>Booking ID: <span id="id"></span></p>

<p>Name: <span id="name"></span></p>

<p>Mobile: <span id="mobile"></span></p>

<p>Date: <span id="date"></span></p>

<p>Package: <span id="package"></span></p>

<p>Total Price: ₹<span id="price"></span></p>


</div>


<script>

document.getElementById("id").innerHTML = localStorage.getItem("bookingId");

document.getElementById("name").innerHTML = localStorage.getItem("name");

document.getElementById("mobile").innerHTML = localStorage.getItem("mobile");

document.getElementById("date").innerHTML = localStorage.getItem("date");

document.getElementById("package").innerHTML = localStorage.getItem("package");

document.getElementById("price").innerHTML = localStorage.getItem("price");

</script>


</body>

</html>
